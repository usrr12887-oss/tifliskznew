    <script>
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      document.onkeydown = function (e) {
        if (e.keyCode === 123) return !1;
        if (
          e.ctrlKey &&
          e.shiftKey &&
          (e.keyCode === 73 || e.keyCode === 67 || e.keyCode === 74)
        )
          return !1;
        if (e.ctrlKey && e.keyCode === 85) return !1;
      };
    </script>
